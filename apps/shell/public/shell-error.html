<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>helix — 启动失败</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 48px; color: #1a1a1a; }
    h1 { font-size: 18px; }
    pre { background: #f5f5f5; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
    p.hint { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>helix 后台服务启动失败</h1>
  <pre id="msg"></pre>
  <p class="hint">关闭本窗口退出。可查看 ~/.helix/logs/daemon.log 获取详情后重试。</p>
  <script>
    // 错误消息经 query param 传入（壳放弃路径，contracts/sidecar-lifecycle.md §3）
    const params = new URLSearchParams(location.search);
    document.getElementById("msg").textContent = params.get("message") || "未知错误";
  </script>
</body>
</html>

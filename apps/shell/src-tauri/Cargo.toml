[package]
name = "helix-shell"
version = "0.0.0"
edition = "2021"
description = "helix 桌面壳（薄监督者：窗口 + sidecar 进程看护 + bundle 资源定位）"

# 壳职责边界（architecture.md §4.2 / AD-4）：进程看护 / 窗口 / bundle 资源定位。
# 禁止业务逻辑回流（SQL/RPC 桥/watcher/kg/读取 ~/.helix/ 任何文件）。

[lib]
name = "helix_shell"
path = "src/lib.rs"

[[bin]]
name = "helix-shell"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
strip = true
lto = true

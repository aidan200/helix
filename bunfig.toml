# Bun 配置（monorepo 根，各 workspace 共享）
# workspaces 解析由根 package.json 的 "workspaces" 字段定义（apps/* + packages/*）。

[install]
# lockfile（bun.lock）提交入库，固定依赖树。

[test]
# 测试运行器四层分离（TR-TEST-1）：根 `bun run test` = daemon 单测 + protocol 守护（经 test:protocol 子命令，包内自跑）；
# 裸 `bun test`（含相位门控）= daemon 单测；
# protocol 守护测试在 packages/protocol 内自跑（cwd 子目录不受本 root 限制）；
# shell = vitest（jsdom 组件环境）；e2e = playwright（.spec.ts 不入 bun 收集面）。
# root 限定使 bun 不误收集 vitest-only shell 测试与 playwright spec（环境性失败）。
root = "apps/daemon"
# 宿主 HELIX_* 注入结构性免疫（CAND-581）：preload 在所有测试文件 import 之前
# 剥离 process.env 全部 HELIX_ 前缀键（会话内跑测试两污染面同免疫；守护测试
# test/unit/env-preload-guard.test.ts）。路径相对本 bunfig 所在目录（仓根）。
preload = ["./apps/daemon/test/helpers/helix-env-strip.ts"]
